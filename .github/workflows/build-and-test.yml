name: Build + Tests and Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  CI: true

jobs:
  prepare:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          token: ${{ github.token }}

      - name: Use Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.x

      - name: Cache Node.js modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

  build-frontend:
    runs-on: ubuntu-24.04
    needs: prepare
    timeout-minutes: 15
    steps:
      - name: Generate Frontend Docker Tags
        id: generate_docker_tags_fe
        run: |
          docker_registry_path="ghcr.io/faircomp/linuxmuster-ui"
          docker_tags_fe="$docker_registry_path:$(echo ${{ github.ref }} | cut -d'/' -f3- | sed 's/[^a-z0-9_-]/-/gi')"
          if [[ ${{ github.ref }} = 'refs/heads/master' ]] || [[ ${{ github.ref }} =~ ^refs/tags/v.*$ ]]; then
            docker_tags_fe+=",$docker_registry_path:latest"
          fi
          echo "docker_tags_fe=$docker_tags_fe" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          token: ${{ github.token }}

      - name: Use Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.x

      - name: Restore cached Node.js modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build Frontend
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Build docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          build-args: |
            buildId=${{ github.sha }}
            version=${{ steps.generate_docker_tags_fe.outputs.docker_tags_fe }}
          context: .
          file: apps/frontend/Dockerfile
          push: false
          load: true
          tags: ${{ steps.generate_docker_tags_fe.outputs.docker_tags_fe }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan frontend image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.generate_docker_tags_fe.outputs.docker_tags_fe }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

  build-api:
    runs-on: ubuntu-24.04
    needs: prepare
    timeout-minutes: 15
    steps:
      - name: Generate API Docker Tags
        id: generate_docker_tags_api
        run: |
          docker_registry_path="ghcr.io/faircomp/linuxmuster-api"
          docker_tags_api="$docker_registry_path:$(echo ${{ github.ref }} | cut -d'/' -f3- | sed 's/[^a-z0-9_-]/-/gi')"
          if [[ ${{ github.ref }} = 'refs/heads/master' ]] || [[ ${{ github.ref }} =~ ^refs/tags/v.*$ ]]; then
            docker_tags_api+=",$docker_registry_path:latest"
          fi
          echo "docker_tags_api=$docker_tags_api" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          token: ${{ github.token }}

      - name: Use Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.x

      - name: Restore cached Node.js modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build Backend
        run: npm run build:api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Build docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          build-args: |
            buildId=${{ github.sha }}
            version=${{ steps.generate_docker_tags_api.outputs.docker_tags_api }}
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: ${{ steps.generate_docker_tags_api.outputs.docker_tags_api }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan api image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.generate_docker_tags_api.outputs.docker_tags_api }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

  test:
    runs-on: ubuntu-24.04
    needs: prepare
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          token: ${{ github.token }}

      - name: Use Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.x

      - name: Restore cached Node.js modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run Checks
        run: |
          npm run check-circular-deps
          npm run check-translations
          npm run check-error-message-translations
          npm run check-external-references
          npm run check-npm-audit
          npm run check:pii-fixtures
          npm run test:scripts
          npm run check-spec-coverage
          npx pretty-quick --check
          npm run lint

      - name: Run API unit tests
        run: npm run test:api:ci

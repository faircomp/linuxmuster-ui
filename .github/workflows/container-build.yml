name: CI Combined Build (Frontend & API)

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      frontend-docker-tags: ${{ steps.generate_frontend_tags.outputs.docker_tags }}
      api-docker-tags: ${{ steps.generate_api_tags.outputs.docker_tags }}
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ github.token }}

      - name: Generate cache key
        id: cache-key
        run: echo "key=${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}" >> $GITHUB_OUTPUT

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x

      - name: Cache Node.js modules
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: '**/node_modules'
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - id: generate_frontend_tags
        run: |
          docker_registry_path="ghcr.io/faircomp/linuxmuster-ui"
          docker_tags="$docker_registry_path:$(echo ${{ github.ref }} | cut -d'/' -f3- | sed 's/[^a-z0-9_-]/-/gi')"
          if [[ ${{ github.ref }} = 'refs/heads/master' ]] || [[ ${{ github.ref }} =~ ^refs/tags/v.*$ ]]
          then
            docker_tags+=",$docker_registry_path:latest"
          fi
          echo "docker_tags=$docker_tags" >> $GITHUB_OUTPUT

      - id: generate_api_tags
        run: |
          docker_registry_path="ghcr.io/faircomp/linuxmuster-api"
          docker_tags="$docker_registry_path:$(echo ${{ github.ref }} | cut -d'/' -f3- | sed 's/[^a-z0-9_-]/-/gi')"
          if [[ ${{ github.ref }} = 'refs/heads/master' ]] || [[ ${{ github.ref }} =~ ^refs/tags/v.*$ ]]
          then
            docker_tags+=",$docker_registry_path:latest"
          fi
          echo "docker_tags=$docker_tags" >> $GITHUB_OUTPUT

  checks:
    runs-on: ubuntu-24.04
    needs: prepare
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ github.token }}

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x

      - name: Restore Node.js modules cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: '**/node_modules'
          key: ${{ needs.prepare.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Lint, test and check translations
        run: npm run lint && npm run test && npx nx test frontend && npm run check-translations

  build-frontend:
    runs-on: ubuntu-24.04
    needs: [prepare, checks]
    timeout-minutes: 10

    steps:
      - run: echo Use docker tags ${{ needs.prepare.outputs.frontend-docker-tags }}

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ github.token }}

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x

      - name: Restore Node.js modules cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: '**/node_modules'
          key: ${{ needs.prepare.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm run build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta_frontend
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ghcr.io/faircomp/linuxmuster-ui

      - name: Build and push docker image
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta_frontend.outputs.json).labels['org.opencontainers.image.created'] }}
            BUILD_NUMBER=${{ github.run_number }}
            APP_VERSION=${{ github.ref_name }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: ${{ needs.prepare.outputs.frontend-docker-tags }}

  build-api:
    runs-on: ubuntu-24.04
    needs: [prepare, checks]
    timeout-minutes: 10

    steps:
      - run: echo Use docker tags ${{ needs.prepare.outputs.api-docker-tags }}

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ github.token }}

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.x

      - name: Restore Node.js modules cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: '**/node_modules'
          key: ${{ needs.prepare.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build Backend
        run: npm run build:api

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta_api
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ghcr.io/faircomp/linuxmuster-api

      - name: Build and push docker image
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta_api.outputs.json).labels['org.opencontainers.image.created'] }}
            BUILD_NUMBER=${{ github.run_number }}
            APP_VERSION=${{ github.ref_name }}
          labels: ${{ steps.meta_api.outputs.labels }}
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ needs.prepare.outputs.api-docker-tags }}

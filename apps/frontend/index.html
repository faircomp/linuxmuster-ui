<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var theme = "system";
        try {
          var stored = localStorage.getItem("theme");
          if (stored) {
            var parsed = JSON.parse(stored);
            theme = parsed.state && parsed.state.theme ? parsed.state.theme : "system";
          }
        } catch (e) {}
        if (theme === "system") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.classList.add(theme);
        document.documentElement.style.setProperty("--initial-bg", theme === "dark" ? "#000000" : "#ffffff");
      })();
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>linuxmuster UI</title>
    <meta
      name="description"
      content="linuxmuster UI – Schulplattform für linuxmuster.net."
    />
    <meta
      name="theme-color"
      content="#000000"
    />
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />
    <meta
      property="og:title"
      content="linuxmuster UI"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <style>
      .loader:empty {
        background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSIzOCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNjQ3NDhiIiBzdHJva2Utd2lkdGg9IjgiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWRhc2hhcnJheT0iMTcwIDgwIi8+PC9zdmc+");
        position: absolute;
        top: calc(50% - 4em);
        left: calc(50% - 4em);
        width: 5em;
        height: 5em;
        animation: spin 25s infinite ease-in;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
          animation-timing-function: ease-in;
        }
        100% {
          transform: rotate(30000deg);
          animation-timing-function: ease-in;
        }
      }

      body {
        background-color: var(--initial-bg, #000000);
        font-family: Lato, sans-serif;
      }
    </style>
  </head>
  <body class="bg-global">
    <div
      id="root"
      class="loader"
    ></div>
    <script
      type="module"
      src="./src/main.tsx"
    ></script>
  </body>
</html>
